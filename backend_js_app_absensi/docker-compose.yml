services:
  db:
    image: postgres:16-alpine
    container_name: absensi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-absensi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-absensi}
      POSTGRES_DB: ${POSTGRES_DB:-absensi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-absensi} -d ${POSTGRES_DB:-absensi}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

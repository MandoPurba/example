# =====================================================================
# Maya - orkestrasi 3 service + PostgreSQL (BRIDGE network "tunel")
#
# Bridge network: antar-container pakai NAMA SERVICE (bukan localhost).
#   db:5432, py:8000, backend_js:8001, frontend:3000
#
# URL koneksi di-set di `environment:` (menimpa .env) supaya:
#   1) benar untuk bridge (service name), dan
#   2) tidak bergantung .env terbaca (mengatasi "injected env 0").
#
# Cloudflare Tunnel: jalankan cloudflared di network "tunel" ini agar bisa
# menjangkau service via nama (mis. http://frontend:3000). Lihat catatan
# di bawah untuk NEXT_PUBLIC_API_URL / NEXTAUTH_URL (URL publik tunnel).
# =====================================================================

services:
  db:
    image: postgres:16
    networks:
      - tunel
    environment:
      POSTGRES_USER: absensi
      POSTGRES_PASSWORD: absensi
      POSTGRES_DB: absensi
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrate + seed otomatis: dijalankan HANYA saat data dir kosong (init pertama)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absensi -d absensi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  py:
    build: ./backend_py_app_absensi
    networks:
      - tunel
    restart: unless-stopped

  backend_js:
    build: ./backend_js_app_absensi
    networks:
      - tunel
    env_file:
      - ./backend_js_app_absensi/.env
    environment:
      # Override .env -> pakai NAMA SERVICE (wajib untuk bridge network)
      DATABASE_URL: postgres://absensi:absensi@db:5432/absensi
      URL_PYTHON_SERVER: http://py:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_app_absensi
      args:
        # Kini NEXT_PUBLIC_API_URL HANYA dipakai server-side (route /api proxy),
        # jadi pakai NAMA SERVICE internal. Browser tidak lagi memakainya langsung
        # (semua lewat /api same-origin) -> cukup tunnel FRONTEND saja.
        NEXT_PUBLIC_API_URL: http://backend_js:8001
        NEXT_PUBLIC_BACKEND_URL: http://backend_js:8001
    networks:
      - tunel
    ports:
      # Hanya frontend yang diekspos ke host -> cloudflared di host bisa
      # menjangkau: cloudflared tunnel --url http://localhost:3000
      # (backend_js/py/db tetap internal, tidak perlu tunnel).
      - "3000:3000"
    env_file:
      - ./frontend_app_absensi/.env
    environment:
      # authorize() memanggil ${NEXTAUTH_URL}/api/auth/sign-in dari SERVER (self),
      # jadi localhost:3000 sudah benar. Redirect ke browser ditangani otomatis
      # oleh trustHost:true (ambil host dari tunnel). Kalau login/redirect bermasalah,
      # baru set ke URL publik tunnel, mis. https://app-xxx.trycloudflare.com
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      - backend_js
    restart: unless-stopped

networks:
  tunel:
    external: true

volumes:
  pgdata:
